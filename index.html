<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصروف البيت</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E7D6B">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصروف البيت">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EC; --card:#FFFFFF; --ink:#1E2826; --muted:#6C7673; --line:#E5E0D6;
  --accent:#2E7D6B; --accent-ink:#FFFFFF; --accent-soft:#E3F0EC;
  --danger:#C2410C; --danger-soft:#FBE9E1; --warn:#B45309; --warn-soft:#FDF1DC;
  --shadow:0 1px 2px rgba(30,40,38,.06),0 4px 14px rgba(30,40,38,.05);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121715; --card:#1B2220; --ink:#E9EEEC; --muted:#93A09B; --line:#2A3330;
    --accent:#4FB39A; --accent-ink:#0E1513; --accent-soft:#1D332D;
    --danger:#F0845A; --danger-soft:#3A2219; --warn:#E6A94F; --warn-soft:#352914;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:19px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.hbtn{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent)}
.hbtn svg{width:20px;height:20px}
.info{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);margin:10px 4px 0}
.info b{color:var(--ink);font-weight:600} .info b.up{color:var(--danger)}
.pill.local{background:var(--line);color:var(--muted)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--danger)} .down{color:var(--accent)}

.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.monthbar button{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px}
.monthbar .m{font-weight:600}

.catrow{display:block;width:100%;text-align:right;padding:12px 0;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:0;padding-top:2px}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}

.due{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:10px 0;border-top:1px solid var(--line)}
.due:first-of-type{border-top:0;padding-top:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.soon{background:var(--warn-soft);color:var(--warn)}

.item{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead{font-size:13px;color:var(--muted);margin:16px 4px 0;font-weight:600}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}

/* forms */
label.f{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:500}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none;min-height:46px}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:110px;direction:ltr;text-align:left;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.amtinp{font-size:34px;font-weight:700;text-align:center;padding:10px;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger-soft)}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:14px;margin:0}
.link{color:var(--accent);font-weight:600;font-size:14px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.subrow{display:flex;gap:8px;margin-bottom:8px}
.x{width:46px;flex:none;border-radius:12px;border:1px solid var(--line);color:var(--danger);font-size:18px}

/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0 8px}
nav.tabs button{flex:1;padding:9px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs svg{width:24px;height:24px}
.fab{position:fixed;z-index:7;left:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));
  width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:32px;line-height:60px;
  box-shadow:0 6px 18px rgba(46,125,107,.35)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,15,14,.45);display:flex;align-items:flex-end;justify-content:center}
.scrim.anim{animation:fade .15s}.scrim.anim .sheet{animation:up .2s ease-out}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.close{position:sticky;top:0;float:left;width:40px;height:40px;margin:-4px -4px 0 0;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:18px;color:var(--muted);z-index:2}
.sheet h2{margin:0 0 4px;font-size:19px}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@keyframes fade{from{opacity:0}}

#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1;pointer-events:auto}
#toast button{color:var(--accent-soft);font-weight:700;margin-inline-start:12px;text-decoration:underline}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.dots{display:flex;gap:16px;margin:22px 0 8px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px;margin-top:18px;direction:ltr}
.keys button{width:76px;height:76px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:28px;font-weight:500}
.keys button.blank{visibility:hidden}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.qchip{padding:9px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
.qchip span{font-weight:400;opacity:.8}
.alert{background:var(--warn-soft);color:var(--warn)}
.alert h3{color:var(--warn)}
.gitem{padding:12px 0;border-top:1px solid var(--line)}
.gitem:first-of-type{border-top:0;padding-top:4px}
.mini{display:inline-block;padding:7px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600}
.mini.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.search{position:relative;margin-top:12px}
.search .inp{padding-inline-start:40px}
.search svg{position:absolute;inset-inline-start:13px;top:13px;width:20px;height:20px;color:var(--muted)}

/* setup */
.setup{padding-top:calc(40px + env(safe-area-inset-top))}
.setup h1{font-size:28px;margin:12px 0 4px}
.choice{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.choice b{display:block;font-size:16px}
.choice span{font-size:14px;color:var(--muted)}
.logo{width:64px;height:64px;border-radius:18px}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.hbar{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.hbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.hbar i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent)}
.hbar span{font-size:11px;color:var(--muted);white-space:nowrap}
.code{direction:ltr;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:90px;overflow:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script type="module">
/* ============ ثوابت ============ */
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const LS_SET = 'masroof_settings', LS_DATA = 'masroof_data';
const COLORS = ['#2E7D6B','#C2410C','#2563EB','#9333EA','#B45309','#DB2777','#0891B2','#4D7C0F','#64748B'];
const DEFAULT_CATS = [
  {id:'bills', name:'فواتير', color:'#C2410C', budget:0, subs:[
    {id:'bills_elec',name:'كهرباء'},{id:'bills_gas',name:'غاز'},{id:'bills_water',name:'مياه'},
    {id:'bills_guard',name:'غفير'},{id:'bills_net',name:'إنترنت'},{id:'bills_mobile',name:'موبايل'}]},
  {id:'home', name:'مصاريف البيت', color:'#2E7D6B', budget:0, subs:[
    {id:'home_food',name:'أكل'},{id:'home_supplies',name:'مستلزمات البيت'}]},
  {id:'edu', name:'تعليم', color:'#2563EB', budget:0, subs:[
    {id:'edu_school',name:'مدارس'},{id:'edu_lessons',name:'دروس'}]},
  {id:'personal', name:'مصاريف شخصية', color:'#9333EA', budget:0, subs:[]},
  {id:'emergency', name:'طوارئ', color:'#B45309', budget:0, subs:[]},
  {id:'saving', name:'ادخار', color:'#0891B2', budget:0, subs:[]},
];

/* ============ أدوات ============ */
const $ = s => document.querySelector(s);
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const clone = o => JSON.parse(JSON.stringify(o));
const uid = (n=10) => { const a='abcdefghijklmnopqrstuvwxyz0123456789'; let s=''; const r=crypto.getRandomValues(new Uint8Array(n)); r.forEach(x=>s+=a[x%36]); return s; };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ds(new Date());
const thisMonth = () => today().slice(0,7);
const num = n => Math.round(n).toLocaleString('ar-EG');
const money = n => num(n) + ' ج.م';
const parseNum = s => parseFloat(String(s??'').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[٫,]/g,'.').replace(/[^\d.]/g,''));
const monthName = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'}); };
const shortMonth = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('ar-EG',{month:'short'}); };
const dayName = d => { const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'}); };
const addMonth = (ym,k) => { const [y,m]=ym.split('-').map(Number); return ds(new Date(y,m-1+k,1)).slice(0,7); };
const when = ts => { if(!ts) return '';
  const d=new Date(ts), t=d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}), k=ds(d), y=new Date(); y.setDate(y.getDate()-1);
  return k===today() ? 'النهارده '+t : k===ds(y) ? 'امبارح '+t : d.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+' '+t; };
const sum = a => a.reduce((t,e)=>t+(+e.amount||0),0);
let toastT, toastFn;
const toast = (msg, action, fn, ms) => { const t=$('#toast'); t.innerHTML = esc(msg) + (action?`<button data-act="toastact">${esc(action)}</button>`:''); toastFn=fn;
  t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>{ t.classList.remove('show'); toastFn=null; }, ms || (action?4500:2200)); };
const norm = s => String(s??'').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[ًٌٍَُِّْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();

/* ============ الحالة ============ */
let settings = load(LS_SET) || {};
const saveSettings = () => save(LS_SET, settings);
const S = {
  cats:[], exps:[], rems:[], shortcuts:[], gameyas:[], goals:[], view:'home', locked: !!(settings.pin), pin:null, month:thisMonth(), ready:false, err:'', pend:{},
  list:{cat:'', q:''},
  rep:{preset:'month', from:'', to:'', cat:'', by:'cat'},
  setup:{step: settings.userName ? 2 : 1, mode:''},
};
let sheet = null; // {type, draft}

const cat = id => S.cats.find(c=>c.id===id);
const catName = id => cat(id)?.name || 'بند محذوف';
const catColor = id => cat(id)?.color || '#94A3B8';
const subName = (cid,sid) => sid ? (cat(cid)?.subs.find(s=>s.id===sid)?.name || '') : '';
const label = e => isIn(e) ? (e.src||'وارد') : (subName(e.catId,e.subId) || catName(e.catId));
const isIn = e => e.type==='in';
const outs = () => S.exps.filter(e=>!isIn(e));
const ins = () => S.exps.filter(isIn);
const INC_SRC = ['مرتب','شغل إضافي','جمعية','أخرى'];
const incSources = () => [...new Set([...INC_SRC, ...ins().map(e=>e.src).filter(Boolean)])];
const people = () => { const s=new Set([settings.userName]); S.exps.forEach(e=>e.by&&s.add(e.by)); return [...s].filter(Boolean); };

/* ============ التخزين ============ */
const Local = {
  async init(){ const d=load(LS_DATA)||{}; S.cats=d.cats||clone(DEFAULT_CATS); S.exps=d.exps||[]; S.rems=d.rems||[]; EXTRA.forEach(k=>S[k]=d[k]||[]); S.ready=true; render(); },
  persist(){ save(LS_DATA,allData()); render(); },
  putItem(k,o){ upsert(S[k],o); this.persist(); },
  delItem(k,id){ S[k]=S[k].filter(x=>x.id!==id); this.persist(); },
  saveCats(l){ S.cats=l; this.persist(); },
  putExp(e){ upsert(S.exps,e); this.persist(); },
  delExp(id){ S.exps=S.exps.filter(x=>x.id!==id); this.persist(); },
  putRem(r){ upsert(S.rems,r); this.persist(); },
  delRem(id){ S.rems=S.rems.filter(x=>x.id!==id); this.persist(); },
  async importAll(d){ S.cats=d.cats||S.cats; S.exps=d.exps||[]; S.rems=d.rems||[]; EXTRA.forEach(k=>S[k]=d[k]||[]); this.persist(); },
};
const EXTRA = ['shortcuts','gameyas','goals'];
const allData = () => ({cats:S.cats, exps:S.exps, rems:S.rems, shortcuts:S.shortcuts, gameyas:S.gameyas, goals:S.goals});
function upsert(arr,o){ const i=arr.findIndex(x=>x.id===o.id); i<0?arr.push(o):arr[i]=o; }

const Cloud = {
  fs:null, db:null, base:'',
  async init(){
    const [appMod, fs] = await Promise.all([import(FB+'firebase-app.js'), import(FB+'firebase-firestore.js')]);
    this.fs = fs;
    const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(settings.fb);
    try { this.db = fs.initializeFirestore(app,{localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
    catch { this.db = fs.getFirestore(app); }
    this.base = 'households/'+settings.hid;
    S.cats = clone(DEFAULT_CATS);
    const opt = {includeMetadataChanges:true};
    const fail = e => { console.error(e); toast('مشكلة في المزامنة: راجع إعدادات Firebase'); };
    fs.onSnapshot(fs.collection(this.db,this.base+'/expenses'), opt, s=>{ S.exps=s.docs.map(d=>d.data()); S.pend.e=s.metadata.hasPendingWrites; if(!s.metadata.fromCache && !s.metadata.hasPendingWrites){ settings.lastSync=Date.now(); saveSettings(); } S.ready=true; render(); }, fail);
    fs.onSnapshot(fs.collection(this.db,this.base+'/reminders'), opt, s=>{ S.rems=s.docs.map(d=>d.data()); S.pend.r=s.metadata.hasPendingWrites; render(); }, fail);
    EXTRA.forEach(k=>fs.onSnapshot(fs.collection(this.db,this.base+'/'+k), opt, s=>{ S[k]=s.docs.map(d=>d.data()); render(); }, fail));
    fs.onSnapshot(fs.doc(this.db,this.base+'/meta/categories'), opt, s=>{ if(s.exists()) S.cats=s.data().list; S.pend.c=s.metadata.hasPendingWrites; render(); }, fail);
    setTimeout(()=>{ if(!S.ready){ S.ready=true; render(); } }, 2500);
  },
  ref(p){ return this.fs.doc(this.db, this.base+'/'+p); },
  w(p){ return p.catch(e=>{ console.error(e); toast('ما اتحفظش على السيرفر: راجع صلاحيات Firebase'); }); },
  saveCats(l){ S.cats=l; this.w(this.fs.setDoc(this.ref('meta/categories'),{list:l})); render(); },
  putExp(e){ this.w(this.fs.setDoc(this.ref('expenses/'+e.id), e)); },
  delExp(id){ this.w(this.fs.deleteDoc(this.ref('expenses/'+id))); },
  putRem(r){ this.w(this.fs.setDoc(this.ref('reminders/'+r.id), r)); },
  delRem(id){ this.w(this.fs.deleteDoc(this.ref('reminders/'+id))); },
  putItem(k,o){ this.w(this.fs.setDoc(this.ref(k+'/'+o.id), o)); },
  delItem(k,id){ this.w(this.fs.deleteDoc(this.ref(k+'/'+id))); },
  async importAll(d){
    EXTRA.forEach(k=>(d[k]||[]).forEach(o=>this.putItem(k,o)));
    if(d.cats) this.saveCats(d.cats);
    (d.exps||[]).forEach(e=>this.putExp(e));
    (d.rems||[]).forEach(r=>this.putRem(r));
  },
};
let Store = Local;

  Store = settings.mode==='cloud' ? Cloud : Local;

function matches(e, q){
  const hay = norm([e.note, label(e), isIn(e)?'وارد':catName(e.catId), e.src, e.by, e.amount, Math.round(e.amount)].join(' '));
  return norm(q).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function listResults(){
  const q = S.list.q.trim();
  let ex = q ? S.exps.filter(e=>matches(e,q)) : S.exps.filter(e=>e.date.startsWith(S.month));
  if(S.list.cat==='_in') ex = ex.filter(isIn);
  else if(S.list.cat) ex = ex.filter(e=>!isIn(e) && e.catId===S.list.cat);
  ex.sort(byDate);
  const eo = ex.filter(e=>!isIn(e)), ei = ex.filter(isIn);
  let h = `<div class="row between small muted" style="margin:4px 4px 0"><span>${q?'نتايج البحث في كل الشهور · ':''}${num(eo.length)} مصروف${ei.length?` · ${num(ei.length)} وارد`:''}</span>
    <span class="amt">${eo.length?money(sum(eo)):''}${ei.length?` <span class="down">+${money(sum(ei))}</span>`:''}</span></div>`;
  if(!ex.length) return h + `<div class="card empty">${q?'مفيش نتايج.':'مفيش مصاريف هنا.'}</div>`;

  for(const d of Object.keys(days)){
    h += `<div class="dayhead row between"><span>${dayName(d)}</span><span>${money(sum(days[d].filter(e=>!isIn(e))))}</span></div>
      <div class="card" style="margin-top:6px;padding:4px 16px">${days[d].map(itemHTML).join('')}</div>`;
  }
  return h;
}

function catMonthSpent(cid, m){ return sum(outs().filter(e=>e.catId===cid && e.date.startsWith(m))); }
function budgetAlerts(ex){
  const rows = S.cats.filter(c=>+c.budget>0).map(c=>({c, v:sum(ex.filter(e=>e.catId===c.id))})).filter(r=>r.v/r.c.budget>=.8);
  if(!rows.length) return '';
  return `<div class="card alert"><h3>تنبيه الميزانية</h3>${rows.map(({c,v})=>`<div class="row between small" style="padding:3px 0">
    <span>${esc(c.name)}: ${v>c.budget?`عدّيت الميزانية بـ ${money(v-c.budget)}`:`فاضل ${money(c.budget-v)} بس`}</span><b>${num(v/c.budget*100)}٪</b></div>`).join('')}</div>`;
}
function budgetNote(cid){
  const c = cat(cid); if(!c || !(+c.budget>0)) return '';
  const pct = catMonthSpent(cid, thisMonth())/c.budget*100;
  if(pct>=100) return ` · ⚠ عدّيت ميزانية ${c.name} (${num(pct)}٪)`;
  if(pct>=80) return ` · ⚠ وصلت ${num(pct)}٪ من ميزانية ${c.name}`;
  return '';
}

  const paid = outs().filter(e=>e.gameyaId===g.id), recv = ins().find(e=>e.gameyaId===g.id);
  return {end, turnM, paid:paid.length, paidNow: paid.some(e=>e.date.startsWith(m)), inRange: m>=g.start && m<=end,
    recv, payout: g.monthly*g.count, done: paid.length>=g.count && !!recv};
}
function gameyaCard(){
  const list = S.gameyas.filter(g=>!gInfo(g).done);

    else if(I.paidNow) act += `<div class="small down" style="margin-top:6px">قسط الشهر ده اتدفع ✓</div>`;
    return `<div class="gitem"><div class="row between"><b>${esc(g.name)}</b><span class="small muted">دفعت ${num(I.paid)} من ${num(g.count)}</span></div>
      <div class="bar"><i style="width:${Math.min(100,I.paid/g.count*100)}%;background:var(--accent)"></i></div>
      <div class="small muted" style="margin-top:6px">قسط ${money(g.monthly)} · ${I.recv?'قبضت ✓':I.turnM<m?'دورك عدّى ولسه ما سجلتش إنك قبضت':'دورك '+monthName(I.turnM)} · هتقبض ${money(I.payout)}</div>${act}</div>`;

/* ---------- القفل ---------- */
async function hashPin(pin, salt){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pin));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function keypad(){
  const P = S.pin;
  const k = n => `<button data-act="pk" data-v="${n}">${num(n)}</button>`;
  return `<div class="dots ${P.err?'err':''}">${[0,1,2,3].map(i=>`<i class="${i<P.val.length?'on':''}"></i>`).join('')}</div>
    ${P.err?`<div class="small up">${esc(P.err)}</div>`:'<div class="small">&nbsp;</div>'}
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(k).join('')}<button class="blank"></button>${k(0)}<button data-act="pk" data-v="del" aria-label="مسح">⌫</button></div>`;
}

    <button class="link" style="margin-top:22px" data-act="pinforgot">نسيت الرقم؟</button></div>`;
}
function shPin(){
  const P = S.pin;
  return `<h2>${P.mode==='set1'?'اختار رقم سري':'اكتبه تاني للتأكيد'}</h2>
    <p class="small muted" style="margin:0">٤ أرقام. التطبيق هيطلبه كل ما تفتحه أو ترجعله بعد دقيقة.</p>
    <div style="display:flex;flex-direction:column;align-items:center">${keypad()}</div>`;
}
async function pinKey(v){
  const P = S.pin; if(!P) return;
  P.err = '';
  if(v==='del') P.val = P.val.slice(0,-1); else if(P.val.length<4) P.val += v;
  if(P.val.length===4){
    if(P.mode==='unlock'){
      if(await hashPin(P.val, settings.pin.salt)===settings.pin.hash){ S.locked=false; S.pin=null; render(); return; }
      P.err='الرقم غلط'; P.val=''; navigator.vibrate?.(150);
    } else if(P.mode==='set1'){ P.first=P.val; P.val=''; P.mode='set2'; }
    else { if(P.val===P.first){ const salt=uid(16); settings.pin={salt, hash: await hashPin(P.val,salt)}; saveSettings(); S.pin=null; closeSheet(); render(); toast('اتفعّل القفل ✓'); return; }
      P.err='مش زي الأول، ابدأ تاني'; P.val=''; P.first=''; P.mode='set1'; }
  }
  if(P.mode==='unlock') render(); else renderSheet();
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) hiddenAt = Date.now();
  else if(settings.pin && hiddenAt && Date.now()-hiddenAt > 60000){ S.locked=true; S.pin=null; sheet=null; render(); }

/* ---------- التقارير ---------- */
function mr(y,m0,n){ return [ds(new Date(y,m0-n+1,1)), ds(new Date(y,m0+1,0))]; }
function ranges(){
  const [y,m] = today().split('-').map(Number), R=S.rep;
  switch(R.preset){
    case 'month': return {cur:mr(y,m-1,1), prev:mr(y,m-2,1)};
    case 'last':  return {cur:mr(y,m-2,1), prev:mr(y,m-3,1)};
    case '3m':    return {cur:mr(y,m-1,3), prev:mr(y,m-4,3)};
    case 'year':  return {cur:[`${y}-01-01`,`${y}-12-31`], prev:[`${y-1}-01-01`,`${y-1}-12-31`]};
    default: {
      const f = R.from||today().slice(0,8)+'01', t = R.to||today();
      const a=new Date(f), b=new Date(t), days=Math.round((b-a)/864e5)+1;
      const pt=new Date(a); pt.setDate(pt.getDate()-1); const pf=new Date(a); pf.setDate(pf.getDate()-days);
      return {cur:[f,t], prev:[ds(pf),ds(pt)]};
    }
  }
}
function repIncome([f,t]){ return sum(ins().filter(e=>e.date>=f && e.date<=t)); }
function repFilter([f,t]){ return outs().filter(e=>e.date>=f && e.date<=t && (!S.rep.cat || e.catId===S.rep.cat)); }

function vReports(){
  const R = S.rep, {cur,prev} = ranges();
  const ex = repFilter(cur), total = sum(ex), ptotal = sum(repFilter(prev));
  const diff = ptotal ? Math.round((total-ptotal)/ptotal*100) : null;
  const by = R.cat && R.by==='cat' ? 'sub' : R.by;
  const groups = {};
  ex.forEach(e=>{
    let k,name,color;
    if(by==='cat'){ k=e.catId; name=catName(e.catId); color=catColor(e.catId); }
    else if(by==='sub'){ k=e.catId+'|'+(e.subId||''); name=(R.cat?'':catName(e.catId)+' › ')+(subName(e.catId,e.subId)||'من غير تفصيل'); color=catColor(e.catId); }
    else { k=e.by||'—'; name=e.by||'—'; color='var(--accent)'; }
    (groups[k]=groups[k]||{name,color,v:0,n:0}); groups[k].v+=+e.amount; groups[k].n++;
  });
  const rows = Object.values(groups).sort((a,b)=>b.v-a.v);
  const P = (k,t) => `<button class="chip ${R.preset===k?'on':''}" data-act="rpre" data-v="${k}">${t}</button>`;
  const B = (k,t) => `<button class="${by===k?'on':''}" data-act="rby" data-v="${k}">${t}</button>`;
  const fmtD = d => { const [yy,mm,dd]=d.split('-').map(Number); return new Date(yy,mm-1,dd).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'}); };

  let h = `<div class="chips" style="margin-top:4px">${P('month','الشهر ده')}${P('last','الشهر اللي فات')}${P('3m','آخر ٣ شهور')}${P('year','السنة دي')}${P('custom','فترة مخصصة')}</div>`;
  if(R.preset==='custom') h += `<div class="row"><div class="grow"><label class="f">من</label><input type="date" class="inp" data-rf="from" value="${cur[0]}"></div>
    <div class="grow"><label class="f">إلى</label><input type="date" class="inp" data-rf="to" value="${cur[1]}"></div></div>`;
  h += `<label class="f">البند</label><select class="inp" data-rf="cat"><option value="">كل البنود</option>${S.cats.map(c=>`<option value="${c.id}" ${R.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
  h += `<div class="seg" style="margin-top:12px">${R.cat?'':B('cat','حسب البند')}${B('sub','حسب الفرعي')}${B('person','حسب الشخص')}</div>`;

  h += `<div class="card"><h3>${fmtD(cur[0])} ← ${fmtD(cur[1])}</h3><div class="big">${money(total)}</div>
    <div class="small muted">${num(ex.length)} مصروف</div>
    ${!R.cat && repIncome(cur) ? `<div class="small" style="margin-top:4px">الوارد <b class="down">${money(repIncome(cur))}</b> · الفاضل <b class="${repIncome(cur)-total<0?'up':''}">${money(repIncome(cur)-total)}</b></div>`:''}
    ${diff!==null?`<div class="small ${diff>0?'up':'down'}">${diff>0?'↑':'↓'} ${num(Math.abs(diff))}٪ عن الفترة اللي قبلها (${money(ptotal)})</div>`:''}</div>`;

  // اتجاه شهري
  const months=[]; for(let m=cur[0].slice(0,7); m<=cur[1].slice(0,7); m=addMonth(m,1)) months.push(m);
  if(months.length>1 && months.length<=24){
    const vals = months.map(m=>sum(ex.filter(e=>e.date.startsWith(m)))), mx=Math.max(1,...vals);
    h += `<div class="card"><h3>كل شهر</h3><div class="hbar">${months.map((m,i)=>`<div><span>${vals[i]?num(vals[i]/1000)+'ك':''}</span><i style="height:${Math.max(2,vals[i]/mx*85)}%"></i><span>${shortMonth(m)}</span></div>`).join('')}</div></div>`;
  }

  h += `<div class="card"><h3>التفاصيل</h3>${rows.length ? rows.map(g=>`
    <div style="padding:10px 0;border-top:1px solid var(--line)">
      <div class="row between"><div class="row grow"><span class="dot" style="background:${g.color}"></span><span class="grow">${esc(g.name)}</span></div>
      <span class="amt">${money(g.v)}</span></div>
      <div class="row between small muted"><span>${num(g.n)} مصروف</span><span>${num(total?g.v/total*100:0)}٪</span></div>
      <div class="bar" style="margin-top:4px"><i style="width:${total?g.v/total*100:0}%;background:${g.color}"></i></div></div>`).join('')
    : '<div class="empty">مفيش مصاريف في الفترة دي.</div>'}</div>`;
  h += `<button class="btn ghost" data-act="csv">تصدير الفترة دي لـ Excel</button>`;
  return h;
}

function parseCfg(t){

  return o.apiKey && o.projectId && o.appId ? o : null;
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if(a==='scrim'){ if(ev.target===el) closeSheet(); return; }
  const go = {
    // setup
    's-name'(){ const n=$('#nm').value.trim(); if(!n) return toast('اكتب اسمك'); settings.userName=n; saveSettings(); S.setup.step=2; render(); },
    's-edit-name'(){ S.setup.step=1; render(); },
    's-mode'(){ S.setup.mode=v; render(); },
    's-back'(){ S.setup.mode=''; render(); },
    's-local'(){ settings.mode='local'; saveSettings(); start(); },
    'do-create'(){ const fb=parseCfg($('#fbcfg').value); if(!fb) return toast('الكود ناقص: لازم يبقى فيه apiKey و projectId و appId');
      enableCloud(fb, uid(24), true).then(()=>{ if(!S.err) openSheet('code'); }); },
    'do-join'(){ const o=parseJoin($('#jcode').value); if(!o) return toast('الكود مش صحيح، انسخه كله تاني');
      enableCloud(o.c, o.h, false).then(()=>{ if(!S.err) toast('انضميت ✓'); }); },
    retry(){ start(); },
    toastact(){ const f=toastFn; toastFn=null; $('#toast').classList.remove('show'); f&&f(); },
    // lock
    pk(){ pinKey(v); },
    pinset(){ S.pin={mode:'set1',val:'',first:''}; openSheet('pin',{}); },
    pinoff(){ if(confirm('تلغي القفل؟')){ delete settings.pin; saveSettings(); render(); toast('اتلغى القفل'); } },
    pinforgot(){ alert('الرقم السري مش محفوظ في أي حتة غير الموبايل ده، فمش ممكن نرجّعه.\n\nلو نسيته، الحل الوحيد إنك تمسح بيانات الموقع من إعدادات Safari أو Chrome، وده هيمسح الحسابات المحفوظة على الموبايل. علشان كده اعمل نسخة احتياطية كل فترة.'); },
    // shortcuts
    quick(){ const q=S.shortcuts.find(x=>x.id===id); if(q) quickAdd(q); },
    newsc(){ openSheet('sc',{_new:true,id:uid(),name:'',amount:'',catId:cat('home')?'home':S.cats[0].id,subId:''}); },
    editsc(){ const q=S.shortcuts.find(x=>x.id===id); if(q) openSheet('sc',{...q,amount:String(q.amount)}); },
    savesc(){ const d=sheet.draft, amt=parseNum(d.amount); if(!d.name.trim()) return toast('اكتب اسم الاختصار'); if(!(amt>0)) return toast('اكتب المبلغ');
      Store.putItem('shortcuts',{id:d.id,name:d.name.trim(),amount:amt,catId:d.catId,subId:d.subId||''}); closeSheet(); toast('اتحفظ الاختصار ✓'); },
    delsc(){ if(confirm('تحذف الاختصار؟')){ Store.delItem('shortcuts',sheet.draft.id); closeSheet(); } },
    repeat(){ const d=sheet.draft; openSheet('exp',{...d,_new:true,id:uid(),date:today(),createdAt:0,remId:'',amount:String(parseNum(d.amount)||'')}); setTimeout(()=>{const i=$('.amtinp'); i?.focus(); i?.select();},250); },
    mksc(){ const d=sheet.draft, name=(d.note||'').trim()||label(d);
      Store.putItem('shortcuts',{id:uid(),name:name.slice(0,24),amount:parseNum(d.amount),catId:d.catId,subId:d.subId||''}); closeSheet(); toast('اتعمل اختصار في الرئيسية ✓'); },
    // gameya
    newg(){ openSheet('g',{_new:true,id:uid(),name:'',monthly:'',count:'',start:thisMonth(),turn:'',catId:cat('saving')?'saving':S.cats[0].id}); },
    editg(){ const g=S.gameyas.find(x=>x.id===id); if(g) openSheet('g',{...g}); },
    saveg(){ const d=sheet.draft, mo=parseNum(d.monthly), c=Math.round(parseNum(d.count)), t=Math.round(parseNum(d.turn));
      if(!d.name.trim()) return toast('اكتب اسم الجمعية'); if(!(mo>0)) return toast('اكتب القسط'); if(!(c>=2)) return toast('عدد الشهور لازم ٢ أو أكتر');
      if(!(t>=1&&t<=c)) return toast(`دورك لازم من ١ لـ ${num(c)}`); if(!/^\d{4}-\d{2}$/.test(d.start||'')) return toast('اختار أول شهر');
      Store.putItem('gameyas',{id:d.id,name:d.name.trim(),monthly:mo,count:c,start:d.start,turn:t,catId:d.catId}); closeSheet(); toast('اتحفظت الجمعية ✓'); },
    delg(){ if(confirm('تحذف الجمعية؟ الأقساط اللي اتسجلت هتفضل في المصاريف.')){ Store.delItem('gameyas',sheet.draft.id); closeSheet(); } },
    gpay(){ const g=S.gameyas.find(x=>x.id===id); openSheet('exp',{_new:true,id:uid(),amount:String(g.monthly),catId:g.catId,subId:'',date:today(),note:'قسط '+g.name,by:settings.userName,remId:'',gameyaId:g.id}); },
    grecv(){ const g=S.gameyas.find(x=>x.id===id); openSheet('exp',{_new:true,type:'in',id:uid(),amount:String(g.monthly*g.count),src:'جمعية',date:today(),note:g.name,by:settings.userName,remId:'',gameyaId:g.id}); },
    // goals
    newgoal(){ openSheet('goal',{_new:true,id:uid(),name:'',target:'',initial:'',catId:cat('saving')?'saving':S.cats[0].id}); },
    editgoal(){ const g=S.goals.find(x=>x.id===id); if(g) openSheet('goal',{...g}); },
    savegoal(){ const d=sheet.draft, t=parseNum(d.target); if(!d.name.trim()) return toast('اكتب اسم الهدف'); if(!(t>0)) return toast('اكتب المبلغ المطلوب');
      Store.putItem('goals',{id:d.id,name:d.name.trim(),target:t,initial:parseNum(d.initial)||0,catId:d.catId}); closeSheet(); toast('اتحفظ الهدف ✓'); },
    delgoal(){ if(confirm('تحذف الهدف؟ اللي اتحوّش هيفضل متسجل في المصاريف.')){ Store.delItem('goals',sheet.draft.id); closeSheet(); } },
    gsave(){ const g=S.goals.find(x=>x.id===id); openSheet('exp',{_new:true,id:uid(),amount:'',catId:g.catId,subId:'',date:today(),note:'ادخار: '+g.name,by:settings.userName,remId:'',goalId:g.id}); setTimeout(()=>$('.amtinp')?.focus(),250); },
    close(){ closeSheet(); },
    // nav
    go(){ S.view=v; window.scrollTo(0,0); render(); },
    mprev(){ S.month=addMonth(S.month,-1); render(); },
    mnext(){ if(S.month<thisMonth()){ S.month=addMonth(S.month,1); render(); } },
    opencat(){ S.list.cat=id; S.view='list'; window.scrollTo(0,0); render(); },
    lcat(){ S.list.cat=id; render(); },
    // expense
    add(){ openSheet('exp',{_new:true,id:uid(),amount:'',catId:S.cats[0]?.id,subId:'',date: S.month===thisMonth()?today():S.month+'-01',note:'',by:settings.userName,remId:''}); setTimeout(()=>$('.amtinp')?.focus(),250); },
    payrem(){ const r=S.rems.find(x=>x.id===id); openSheet('exp',{_new:true,id:uid(),amount:r.lastAmount||'',catId:r.catId,subId:r.subId||'',date:today(),note:r.name,by:settings.userName,remId:r.id}); setTimeout(()=>{const i=$('.amtinp'); i?.focus(); i?.select();},250); },
    edit(){ const e=S.exps.find(x=>x.id===id); if(e) openSheet('exp',{...e,amount:String(e.amount)}); },
    dcat(){ sheet.draft.catId=id; sheet.draft.subId=''; renderSheet(); },
    dsub(){ sheet.draft.subId=id; renderSheet(); },
    dby(){ sheet.draft.by=v; renderSheet(); },
    dtype(){ sheet.draft.type=v; if(v==='in'&&!sheet.draft.src) sheet.draft.src='مرتب'; renderSheet(); },
    dsrc(){ sheet.draft.src=v; renderSheet(); },
    dnewsrc(){ const n=prompt('اسم المصدر'); if(n&&n.trim()){ sheet.draft.src=n.trim(); renderSheet(); } },
    dnewcat(){ const n=prompt('اسم البند الجديد'); if(!n||!n.trim()) return;
      const c={id:uid(8),name:n.trim(),color:COLORS[S.cats.length%COLORS.length],budget:0,subs:[]};
      Store.saveCats([...clone(S.cats),c]); sheet.draft.catId=c.id; sheet.draft.subId=''; renderSheet(); toast('اتضاف البند ✓'); },
    exportmenu(){ openSheet('export',{}); },
    xmonth(){ closeSheet(); const m=S.month; exportXlsx(periodEntries([m+'-01',m+'-31']), `masroof-${m}.xlsx`); },
    xall(){ closeSheet(); exportXlsx(periodEntries(['0000-01-01','9999-12-31']), `masroof-all-${today()}.xlsx`); },
    xbackup(){ closeSheet(); doBackup(); },
    dnewsub(){ const n=prompt('اسم البند الفرعي الجديد'); if(!n||!n.trim()) return;
      const list=clone(S.cats), c=list.find(x=>x.id===sheet.draft.catId), s={id:uid(8),name:n.trim()};
      c.subs.push(s); Store.saveCats(list); sheet.draft.subId=s.id; renderSheet(); },
    saveexp(){ const d=sheet.draft, amt=parseNum(d.amount);
      if(!(amt>0)) return toast('اكتب المبلغ');
      if(d.type==='in'){ Store.putExp({id:d.id,type:'in',amount:Math.round(amt*100)/100,src:d.src||'أخرى',catId:'',subId:'',date:d.date||today(),note:(d.note||'').trim(),by:d.by||settings.userName,remId:'',gameyaId:d.gameyaId||'',goalId:'',createdAt:d.createdAt||Date.now()});
        closeSheet(); if(d._new) goHome(d.date); return toast(d._new?'اتسجل الوارد ✓':'اتعدّل ✓'); }
      const e={id:d.id,type:'out',amount:Math.round(amt*100)/100,catId:d.catId,subId:d.subId||'',date:d.date||today(),note:(d.note||'').trim(),by:d.by||settings.userName,remId:d.remId||'',gameyaId:d.gameyaId||'',goalId:d.goalId||'',createdAt:d.createdAt||Date.now()};
      Store.putExp(e);
      if(e.remId){ const r=S.rems.find(x=>x.id===e.remId); if(r) Store.putRem({...r,lastAmount:e.amount}); }
      closeSheet(); if(d._new) goHome(e.date); const bn = e.date.startsWith(thisMonth()) ? budgetNote(e.catId) : '';
      toast((d._new?'اتسجل ✓':'اتعدّل ✓') + bn, null, null, bn?5000:0); },
    delexp(){ if(confirm('تحذف المصروف ده؟')){ Store.delExp(sheet.draft.id); closeSheet(); toast('اتحذف'); } },
    // categories
    newcat(){ openSheet('cat',{_new:true,id:uid(8),name:'',color:COLORS[S.cats.length%COLORS.length],budget:'',subs:[]}); },
    editcat(){ openSheet('cat',clone(cat(id))); },
    ccolor(){ sheet.draft.color=v; renderSheet(); },
    caddsub(){ sheet.draft.subs.push({id:uid(8),name:''}); renderSheet(); setTimeout(()=>[...document.querySelectorAll('[data-sub]')].pop()?.focus(),50); },
    cdelsub(){ const s=sheet.draft.subs[+el.dataset.i]; const n=S.exps.filter(e=>e.subId===s.id).length;
      if(n && !confirm(`فيه ${num(n)} مصروف على "${s.name}". هيفضلوا محسوبين على البند الرئيسي. تكمّل؟`)) return;
      sheet.draft.subs.splice(+el.dataset.i,1); renderSheet(); },
    savecat(){ const d=sheet.draft; if(!d.name.trim()) return toast('اكتب اسم البند');
      const c={id:d.id,name:d.name.trim(),color:d.color,budget:parseNum(d.budget)||0,subs:d.subs.filter(s=>s.name.trim()).map(s=>({id:s.id,name:s.name.trim()}))};
      const list=clone(S.cats), i=list.findIndex(x=>x.id===c.id); i<0?list.push(c):list[i]=c;
      Store.saveCats(list); closeSheet(); toast('اتحفظ ✓'); },
    delcat(){ const d=sheet.draft;
      if(S.exps.some(e=>e.catId===d.id)) return toast('البند ده عليه مصاريف، تقدر تغيّر اسمه بس');
      if(S.cats.length<=1) return toast('لازم يفضل بند واحد على الأقل');
      if(confirm('تحذف البند؟')){ Store.saveCats(S.cats.filter(x=>x.id!==d.id)); closeSheet(); } },
    // reminders
    newrem(){ openSheet('rem',{_new:true,id:uid(),name:'',catId:'bills',subId:'',day:1,lastAmount:0}); if(!cat('bills')) sheet.draft.catId=S.cats[0].id; renderSheet(); },
    editrem(){ openSheet('rem',clone(S.rems.find(x=>x.id===id))); },
    saverem(){ const d=sheet.draft, day=Math.round(parseNum(d.day));
      if(!d.name.trim()) return toast('اكتب اسم التذكير'); if(!(day>=1&&day<=31)) return toast('اليوم لازم يبقى من ١ لـ ٣١');
      Store.putRem({id:d.id,name:d.name.trim(),catId:d.catId,subId:d.subId||'',day,lastAmount:d.lastAmount||0}); closeSheet(); toast('اتحفظ ✓'); },
    delrem(){ if(confirm('تحذف التذكير؟')){ Store.delRem(sheet.draft.id); closeSheet(); } },
    // reports
    rpre(){ S.rep.preset=v; render(); },
    rby(){ S.rep.by=v; render(); },
    csv(){ exportCSV(); },
    // settings / sync
    sharecode(){ openSheet('code'); },
    doshare(){ shareText(joinCode()); },
    docopy(){ navigator.clipboard?.writeText(joinCode()).then(()=>toast('اتنسخ ✓'),()=>toast('انسخه يدوي')); },
    synccreate(){ openSheet('synccreate'); },
    syncjoin(){ openSheet('syncjoin'); },
    backup(){ doBackup(); },
    restore(){ const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
      i.onchange=async()=>{ try{ const d=JSON.parse(await i.files[0].text()); if(d.app!=='masroof') throw 0;
        if(!confirm(`النسخة فيها ${num(d.exps.length)} مصروف. تسترجعها؟`)) return;
        if(Store===Local) await Local.importAll(d); else { await Cloud.importAll(d); } toast('اترجعت ✓'); } catch { toast('الملف ده مش نسخة من التطبيق'); } };
      i.click(); },
    reset(){ if(!confirm('هتخرج من التطبيق على الموبايل ده. لو المزامنة شغالة، بياناتك هتفضل محفوظة عند التاني. تكمّل؟')) return;
      if(settings.mode==='local' && !confirm('البيانات على الموبايل ده بس وهتتمسح. متأكد؟')) return;
      localStorage.removeItem(LS_SET); if(settings.mode==='local') localStorage.removeItem(LS_DATA); location.reload(); },
  };
  if(go[a]) go[a]();
});

document.addEventListener('input', ev => {
  const t = ev.target, ds_ = t.dataset;
  if(ds_.df){ sheet.draft[ds_.df]=t.value; }
  else if(ds_.cf){ sheet.draft[ds_.cf]=t.value; }
  else if(ds_.sub!==undefined){ sheet.draft.subs[+ds_.sub].name=t.value; }
  else if(ds_.rmf){ sheet.draft[ds_.rmf]=t.value; if(ds_.rmf==='catId'){ sheet.draft.subId=''; renderSheet(); } }
  else if(ds_.gf){ sheet.draft[ds_.gf]=t.value; if(ds_.gf==='catId' && 'subId' in sheet.draft){ sheet.draft.subId=''; renderSheet(); } }
  else if(ds_.q!==undefined){ S.list.q=t.value; const r=$('#lres'); if(r) r.innerHTML=listResults();
    const mb=document.querySelector('main .monthbar'); if(mb) mb.style.display=t.value.trim()?'none':''; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.dataset.rf){ S.rep[t.dataset.rf]=t.value; if(t.dataset.rf==='cat'&&t.value&&S.rep.by==='cat') S.rep.by='sub'; render(); }
  if(t.dataset.sf==='userName'){ const n=t.value.trim(); if(n){ settings.userName=n; saveSettings(); toast('اتحفظ ✓'); } }
});
window.addEventListener('online', render); window.addEventListener('offline', render);

/* ============ تصدير ============ */
function periodEntries([f,t], catFilter){
  return [...outs().filter(e=>e.date>=f&&e.date<=t&&(!catFilter||e.catId===catFilter)),
          ...(catFilter?[]:ins().filter(e=>e.date>=f&&e.date<=t))].sort((a,b)=>a.date.localeCompare(b.date));
}
function exportCSV(){ const {cur}=ranges(); exportXlsx(periodEntries(cur,S.rep.cat), `masroof-${cur[0]}_${cur[1]}.xlsx`); }

/* ملف Excel حقيقي (.xlsx) من غير مكتبات علشان يشتغل أوفلاين */
function crc32(u8){
  const T = crc32.t || (crc32.t = Array.from({length:256},(_,n)=>{let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; return c>>>0;}));
  let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0;
}
function zipBlob(files, type){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0, n=0;
  for(const [name,str] of Object.entries(files)){
    const nm=enc.encode(name), d=enc.encode(str), crc=crc32(d); n++;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true); h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true); c.setUint32(20,d.length,true); c.setUint32(24,d.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);
    off += 30+nm.length+d.length;
  }
  const cs=cen.reduce((t,a)=>t+a.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,n,true); e.setUint16(10,n,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type});
}
function sheetXML(rows, widths){
  const x = v => String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col = i => String.fromCharCode(65+i);
  const data = rows.map((row,ri)=>`<row r="${ri+1}">`+row.map((c,ci)=>{
    if(c===null||c===undefined||c==='') return '';
    const o = typeof c==='object' ? c : {v:c}, ref=col(ci)+(ri+1), st=o.s?` s="${o.s}"`:'';
    return typeof o.v==='number' ? `<c r="${ref}"${st}><v>${o.v}</v></c>` : `<c r="${ref}" t="inlineStr"${st}><is><t>${x(o.v)}</t></is></c>`;
  }).join('')+'</row>').join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${data}</sheetData></worksheet>`;
}
function exportXlsx(ex, name){
  if(!ex.length) return toast('مفيش حاجة متسجلة في الفترة دي');
  const H = v => ({v,s:1}), N = v => ({v:+v||0,s:2}), T = v => ({v:+v||0,s:3});
  const rows = [['التاريخ','النوع','البند / المصدر','البند الفرعي','المبلغ','مين','ملاحظة'].map(H)];
  ex.forEach(e=>rows.push(isIn(e) ? [e.date,'وارد',e.src||'','',N(e.amount),e.by||'',e.note||'']
    : [e.date,'مصروف',catName(e.catId),subName(e.catId,e.subId),N(e.amount),e.by||'',e.note||'']));
  const to=sum(ex.filter(e=>!isIn(e))), ti=sum(ex.filter(isIn));
  rows.push([]); rows.push(['','','',H('إجمالي المصروف'),T(to)]);
  if(ti){ rows.push(['','','',H('إجمالي الوارد'),T(ti)]); rows.push(['','','',H('الفاضل'),T(ti-to)]); }
  // ملخص البنود
  const sm = [[H('البند'),H('البند الفرعي'),H('المبلغ'),H('النسبة ٪')]];
  S.cats.forEach(c=>{
    const ce = ex.filter(e=>!isIn(e)&&e.catId===c.id), v=sum(ce); if(!v) return;
    sm.push([{v:c.name,s:1},'',T(v),{v:to?Math.round(v/to*1000)/10:0,s:3}]);
    const subs = {}; ce.forEach(e=>{ const k=subName(e.catId,e.subId)||'من غير تفصيل'; subs[k]=(subs[k]||0)+(+e.amount); });
    Object.entries(subs).sort((a,b)=>b[1]-a[1]).forEach(([k,sv])=>sm.push(['',k,N(sv),{v:to?Math.round(sv/to*1000)/10:0}]));
  });
  sm.push([]); sm.push([H('إجمالي المصروف'),'',T(to)]);
  if(ti){ sm.push([H('إجمالي الوارد'),'',T(ti)]); sm.push([H('الفاضل'),'',T(ti-to)]); }
  const NS='http://schemas.openxmlformats.org/', X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files = {
    '[Content_Types].xml': `${X}<Types xmlns="${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`,
    '_rels/.rels': `${X}<Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
    'xl/workbook.xml': `${X}<workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><sheets><sheet name="السجل" sheetId="1" r:id="rId1"/><sheet name="ملخص البنود" sheetId="2" r:id="rId2"/></sheets></workbook>`,
    'xl/_rels/workbook.xml.rels': `${X}<Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
    'xl/styles.xml': `${X}<styleSheet xmlns="${NS}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3F0EC"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="1" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
    'xl/worksheets/sheet1.xml': sheetXML(rows,[12,9,18,16,12,12,24]),
    'xl/worksheets/sheet2.xml': sheetXML(sm,[18,18,14,10]),
  };
  shareFile(zipBlob(files,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'), name);
}
function doBackup(){
  const blob=new Blob([JSON.stringify({app:'masroof',v:2,...allData()},null,1)],{type:'application/json'});
  shareFile(blob,`masroof-backup-${today()}.json`);
  settings.lastBackup=Date.now(); saveSettings(); render();
}
function shareFile(blob,name){
  const file = new File([blob],name,{type:blob.type});
  const mobile = matchMedia('(pointer:coarse)').matches;
  if(mobile && navigator.canShare && navigator.canShare({files:[file]})) { navigator.share({files:[file]}).catch(()=>{}); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function shareText(t){
  if(navigator.share) navigator.share({text:t}).catch(()=>{});
  else navigator.clipboard?.writeText(t).then(()=>toast('اتنسخ ✓'));
}
